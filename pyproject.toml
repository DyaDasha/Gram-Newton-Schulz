[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gram-muon"
version = "0.1.0"
description = "Gram Newton-Schulz orthogonalization and a Muon optimizer prototype."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gram_muon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
